name: Playwright CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        npm install
        npx playwright install --with-deps  # Make sure browsers and dependencies are installed

    - name: Run Playwright tests
      run: |
        npm run test  # Run Playwright tests

    - name: Generate Allure report
      run: |
        npm run allure-report  # Generate Allure report (if needed)
